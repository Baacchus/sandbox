<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hello Random Generator - Dark Mode Mobile</title>
  
  <!-- Typographie moderne -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- Halo lumineux d'arrière-plan (Dark Mode Ambient Glow) -->
  <div class="glow-container">
    <div class="glow-blob blob-purple"></div>
    <div class="glow-blob blob-cyan"></div>
  </div>

  <!-- Conteneur Mobile -->
  <div class="mobile-container">
    
    <!-- En-tête -->
    <header class="app-header">
      <div class="badge">
        <span class="pulse-dot"></span>
        <span>Dark Mode Active</span>
      </div>
      <div class="version-tag">v2.0 🎲</div>
    </header>

    <!-- Contenu Principal -->
    <main class="main-content">
      
      <!-- Titre principal -->
      <div class="hero-section">
        <div class="icon-avatar">👋</div>
        <h1>Hello <span class="gradient-text">World!</span></h1>
        <p class="subtitle">Cliquez sur le bouton ci-dessous pour générer une pensée ou citation aléatoire.</p>
      </div>

      <!-- Carte d'affichage du texte aléatoire -->
      <div class="glass-card quote-card" id="quote-card">
        <div class="quote-icon">“</div>
        <p id="random-text" class="quote-text">
          Clique sur le bouton ci-dessous pour découvrir ton premier message !
        </p>
        <div class="quote-footer">
          <span id="text-category" class="category-tag">✨ Découverte</span>
          <button id="copy-btn" class="icon-action-btn" title="Copier le texte" aria-label="Copier">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bouton d'action principal -->
      <button id="generate-btn" class="primary-btn">
        <span class="btn-icon">🎲</span>
        <span class="btn-text">Générer un message aléatoire</span>
      </button>

      <!-- Compteur de messages -->
      <div class="stats-bar">
        <span>Messages générés : <strong id="counter">0</strong></span>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
